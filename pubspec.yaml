name: taskflow_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  
  # Internacionalización (CORREGIDO - usa la versión que requiere Flutter)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2  # ✅ Esta es la versión correcta (no 0.19.0)
  
  # UI
  cupertino_icons: ^1.0.6

  # Conexión HTTP
  http: ^1.2.0

  # Almacenamiento local (token)
  shared_preferences: ^2.2.2

  # Manejo de estado (BLoC)
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Imágenes desde red
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true